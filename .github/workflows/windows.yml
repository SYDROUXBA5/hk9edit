name: windows-smoke
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install numpy scipy pillow
      - name: ffmpeg (full build)
        run: choco install ffmpeg-full -y --no-progress
      - name: Whisper (latest whisper.cpp release, tiny English model for speed)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest
          $asset = $rel.assets | Where-Object name -eq 'whisper-bin-x64.zip' | Select-Object -First 1
          Write-Host "whisper.cpp $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath C:\whisper
          $exe = (Get-ChildItem C:\whisper -Recurse -Filter whisper-cli.exe | Select-Object -First 1).FullName
          Write-Host "whisper-cli: $exe"
          Add-Content -Path $env:GITHUB_ENV -Value "WHISPER_CLI=$exe"
          New-Item -ItemType Directory -Force "$HOME\.whisper-models" | Out-Null
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin -OutFile "$HOME\.whisper-models\ggml-tiny.en.bin"
          Add-Content -Path $env:GITHUB_ENV -Value "WHISPER_MODEL=$HOME\.whisper-models\ggml-tiny.en.bin"
      - name: Setup check
        run: python scripts/setup_check.py
      - name: Smoke test (made-up footage, both formats, graphics, captions, music)
        run: python tests/smoke_test.py tests/out
      - name: Contact sheets
        if: always()
        run: |
          python scripts/gfx.py sheet tests/out/sheet_vertical.jpg
          python scripts/gfx.py sheet tests/out/sheet_horizontal.jpg --horizontal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: |
            tests/out/*.png
            tests/out/*.jpg
            tests/out/videos/*.mp4
            tests/out/edit/work_social_edit/captions.txt
